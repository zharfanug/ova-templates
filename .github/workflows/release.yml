name: release

# Tag vX.Y.Z (pushed by the repository owner): build every template with
# product version X.Y.Z and attach the OVAs to the GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ova-build
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'zharfanug/ova-templates' &&
      github.actor == 'zharfanug' && github.triggering_actor == 'zharfanug'
    runs-on: [self-hosted, linux, x64, ova-builder]
    timeout-minutes: 180
    steps:
      - name: Check tag format
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::tag must be vX.Y.Z, got $GITHUB_REF_NAME"; exit 1; }
          echo "PRODUCT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # No new build: the images kept by the build job for this commit are
      # repackaged with the release version (fails if they are from
      # another commit).
      - name: Package the kept build
        id: build
        run: .github/scripts/release-from-build.sh

      - name: Upload logs and descriptors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            logs/
            build/*/*.ovf
            build/*/*.ova.sha256
          retention-days: 14
          if-no-files-found: warn

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=()
          for id in ${{ steps.build.outputs.ids }}; do
            files+=(build/"$id"/*.ova build/"$id"/*.ova.sha256 build/"$id"/*.ovf)
          done
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

      - name: Keep the release on the runner
        run: |
          keep="${OVA_KEEP_DIR:-$HOME/ova-builds}"
          rm -rf "$keep/release.new"
          mkdir -p "$keep/release.new"
          for id in ${{ steps.build.outputs.ids }}; do
            cp -a build/"$id"/*.ova build/"$id"/*.ova.sha256 build/"$id"/*.ovf "$keep/release.new/"
          done
          echo "$GITHUB_REF_NAME" > "$keep/release.new/TAG"
          rm -rf "$keep/release"
          mv "$keep/release.new" "$keep/release"
