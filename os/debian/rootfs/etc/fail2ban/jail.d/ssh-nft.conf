#ssh-nft-f2b v1.0.2
[DEFAULT]
# Ban for 1 hour, escalate exponentially up to 7 days with randomization
# (factor 1: the formula already doubles -> 1h, 2h, 4h, ... 7d)
bantime = 1h
bantime.increment = true
bantime.factor = 1
bantime.rndtime = 30m
bantime.maxtime = 7d
# Monitoring window & thresholds
findtime = 10m
maxretry = 5

# Do not ban localhost or trusted IPs
ignoreip = 127.0.0.1/8 ::1/128

# Use systemd journal & nftables for banning
# Ban = every port, TCP and UDP, silently dropped (no reply). protocol must
# be set here: the jail value overrides one inside banaction[...].
backend = systemd
banaction = nftables-allports[blocktype=drop]
banaction_allports = nftables-allports[blocktype=drop]
protocol = tcp,udp

# Email notifications (optional)
# destemail = alerts@your-domain.com
# sender = fail2ban@your-domain.com
# action = %(action_mwl)s

[sshd]
enabled = true
port = 10022
logpath = %(sshd_log)s
# aggressive: key-only SSH attacks never fail a password; their traces
# (preauth disconnects, no supported authentication methods, ...) are
# only in the aggressive patterns
mode = aggressive
