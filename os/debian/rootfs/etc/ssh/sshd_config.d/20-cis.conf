# CIS SSH settings. Drop-ins are read before the main sshd_config, so
# these values win.

# Only members of group sudo or ssh (the admin is in both).
AllowGroups sudo ssh
PermitRootLogin no

MaxAuthTries 4
LoginGraceTime 60
MaxStartups 10:30:60
# Drop dead connections after 3 unanswered checks 5 min apart.
ClientAliveInterval 300
ClientAliveCountMax 3

# No port, agent, X11 or stream-local forwarding (no tunnels through the VM).
DisableForwarding yes

# Strong algorithms only (no CBC ciphers, no SHA-1 / UMAC MACs, no SHA-1 key
# exchange).
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
