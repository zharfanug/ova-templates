# vapp-seed writes a NoCloud seed from the vApp properties every boot,
# before cloud-init runs. None: cloud-init still runs (SSH host keys)
# when there is no seed.
datasource_list: [ NoCloud, None ]

# ifupdown (/etc/network/interfaces.d/50-cloud-init), like a stock
# Debian server install.
system_info:
  network:
    renderers: [ eni ]
